name: Selenium CI Pipeline

on:
  push:

  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - dev
          - stage

      browser:
        description: "Select Browser"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox

      threads:
        description: "Parallel Threads"
        required: true
        default: "2"

      node_version:
        description: "Select Node Version"
        required: true
        default: "18"
        type: choice
        options:
          - 16
          - 18
          - 20

jobs:
  test:
    runs-on: windows-latest

    env:
      ENV: ${{ inputs.environment }}
      BROWSER: ${{ inputs.browser }}
      THREADS: ${{ inputs.threads }}

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Setup Node (from workflow input)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # 4. Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven

      # 5. Build project
      - name: Build Project
        run: mvn clean install

      # 6. Run Tests
      - name: Execute Tests
        run: mvn clean test

      # 7. Install Allure CLI (Windows)
      - name: Install Allure
        run: |
          Invoke-WebRequest -Uri https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.zip -OutFile allure.zip
          Expand-Archive allure.zip
          Move-Item allure-2.25.0 C:\allure
          echo "C:\allure\bin" | Out-File -Append $env:GITHUB_PATH

      # 8. Generate Allure Report
      - name: Generate Allure Report
        run: allure generate target/allure-results -o allure-report --clean

      # 9. Deploy Report to GitHub Pages (LIVE LINK)
      - name: Deploy Allure Report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report