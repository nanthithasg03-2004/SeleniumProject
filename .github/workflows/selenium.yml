name: Selenium Execution Pipeline

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Select Environment"
        required: true
        default: "qa"
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

      browser:
        description: "Select Browser"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox

      version:
        description: "Java Version"
        required: true
        default: "21"

      threads:
        description: "Parallel Workers"
        required: true
        default: "2"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.version }}

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Execute Selenium Tests
        run: mvn clean test
        env:
          ENV: ${{ inputs.env }}
          BROWSER: ${{ inputs.browser }}
          THREADS: ${{ inputs.threads }}

      - name: Generate Allure Report
        run: mvn allure:report

      # DEBUG STEP
      - name: List Generated Files
        run: |
          dir
          dir target
          dir target\site
          dir target\site /s

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven

  deploy-report:
    needs: run-tests
    runs-on: windows-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Show Report URL
        run: |
          echo "## Allure Report" >> $env:GITHUB_STEP_SUMMARY
          echo "https://nanthithasg03-2004.github.io/SeleniumProject/" >> $env:GITHUB_STEP_SUMMARY